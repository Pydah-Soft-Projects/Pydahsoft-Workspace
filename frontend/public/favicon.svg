<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09233d" />
      <stop offset="100%" stop-color="#0f3456" />
    </linearGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20b875" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Shield/Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-opacity="0.5"/>
  
  <!-- Styled Letter 'P' for PydahSoft -->
  <!-- Vertical Stem -->
  <rect x="144" y="128" width="68" height="256" rx="34" fill="url(#pGrad)" />
  
  <!-- Upper Loop of 'P' -->
  <path d="M 144 128 L 280 128 C 345 128, 384 165, 384 224 C 384 283, 345 320, 280 320 L 144 320 Z" fill="url(#pGrad)" />
  <!-- Inner Cutout of 'P' -->
  <path d="M 212 188 L 272 188 C 304 188, 324 202, 324 224 C 324 246, 304 260, 272 260 L 212 260 Z" fill="#09233d" />
  
  <!-- Accent Dot (Performance Spark) -->
  <circle cx="360" cy="352" r="28" fill="url(#accentGrad)" />
</svg>